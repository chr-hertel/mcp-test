name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The point of this repository is to notice when upstream moves.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, fileinfo, pdo_sqlite
          coverage: none
          # An MCP tool that samples or elicits waits on a human; the default
          # 30s would kill the process mid-fiber.
          ini-values: max_execution_time=0, memory_limit=512M

      - name: Clone symfony/ai and apply the patches
        run: make upstream

      - name: Fail if the upstream branch has moved
        # The whole point of the nightly run: `make upstream` clones the branch
        # tip, so a patch that no longer fits it fails there — and this compares
        # the clone against the tip once more, in case the branch moved between
        # the clone and now.
        #
        # mcp/sdk needs no equivalent: it comes from Packagist as "dev-main", so
        # composer resolves the current tip on every run and a break shows up as
        # a failing check rather than as drift.
        run: make upstream-check

      - uses: ramsey/composer-install@v3

      - name: Seed the databases
        run: make db

      - name: PHPUnit
        run: make test

      - name: Regression suite over STDIO
        run: make regression-stdio

      - name: Regression suite over HTTP
        run: |
          # Two workers minimum, or a server-to-client round trip deadlocks.
          # See docs/deployment.md.
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:8099 -t public public/index.php &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8099/" && break
            sleep 1
          done
          php bin/console app:mcp:regression --transport=http
        env:
          MCP_DEMO_BASE_URL: http://127.0.0.1:8099

  upstream:
    name: Upstream suite, patched
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, fileinfo
          coverage: none

      - name: Clone symfony/ai and apply the patches
        run: make upstream

      # bin/link-sdk points the bundle at the mcp/sdk this demo installed, so
      # the bundle's own suite and ours cannot disagree about which SDK they
      # mean — and the patched bundle needs the 2026-07-28 surface, which the
      # "^0.7" its composer.json asks for does not have.
      - uses: ramsey/composer-install@v3

      - name: symfony/mcp-bundle
        run: make upstream-test

      # No mcp/sdk job: we carry no patches against it, so its suite is not ours
      # to run. Packagist "dev-main" means every run above already resolves its
      # current tip.
