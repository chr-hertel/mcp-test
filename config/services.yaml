# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # The directory the MCP client advertises to servers as a workspace root, and
    # that `import_proposals_from_roots` scans for "*.proposal.md" files.
    app.workspace_dir: '%kernel.project_dir%/%env(MCP_DEMO_WORKSPACE_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every class in src/ becomes a service. That is what makes the MCP attributes
    # work without any further wiring: the bundle reflects the attributes of
    # registered services at compile time, so a plain #[McpTool] on an autowired
    # class is enough to make it available to a server.
    App\:
        resource: '../src/'

    App\Security\OrganizerTokenAuthenticator:
        arguments:
            $expectedToken: '%env(MCP_DEMO_ORGANIZER_TOKEN)%'

    App\Mcp\Client\WorkspaceRootsProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $workspaceDir: '%app.workspace_dir%'

    # The bundle's per-server locators are not autowirable by type (two of them
    # share ServiceProviderInterface), so the dashboard names them explicitly.
    App\Controller\DashboardController:
        arguments:
            $builders: '@mcp.server_locator.builder'
            $registries: '@mcp.server_locator.registry'
        tags: ['controller.service_arguments']

    App\Command\SeedCommand:
        arguments:
            $environment: '%kernel.environment%'

    App\Command\ClaudeDesktopConfigCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # The scripted elicitation handler is stateful: a test scripts an answer and
    # then reads back what was asked. Resetting it on kernel.reset keeps that
    # state from leaking between requests in a long-running worker.
    App\Mcp\Client\ScriptedElicitationHandler:
        tags:
            - { name: kernel.reset, method: reset }
