# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # The directory the MCP client advertises to servers as a workspace root, and
    # that `import_proposals_from_roots` scans for "*.proposal.md" files.
    app.workspace_dir: '%kernel.project_dir%/%env(MCP_DEMO_WORKSPACE_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every class in src/ becomes a service. That is what makes the MCP attributes
    # work without any further wiring: the bundle reflects the attributes of
    # registered services at compile time, so a plain #[McpTool] on an autowired
    # class is enough to make it available to a server.
    App\:
        resource: '../src/'

    App\Security\OrganizerTokenAuthenticator:
        arguments:
            $expectedToken: '%env(MCP_DEMO_ORGANIZER_TOKEN)%'

    App\Mcp\Client\WorkspaceRootsProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $workspaceDir: '%app.workspace_dir%'

    # The bundle's per-server locators are not autowirable by type (two of them
    # share ServiceProviderInterface), so the dashboard names them explicitly.
    App\Controller\DashboardController:
        arguments:
            $builders: '@mcp.server_locator.builder'
            $registries: '@mcp.server_locator.registry'
        tags: ['controller.service_arguments']

    # The per-server registry is not autowirable, so the one tool that changes it
    # names the modern server's explicitly.
    App\Mcp\Tool\Modern\RegistryChangeTool:
        arguments:
            $registry: '@mcp.server.modern.registry'

    App\Command\McpRegressionCommand:
        arguments:
            $modernEndpoint: '%env(MCP_DEMO_BASE_URL)%/mcp/2026'

    App\Command\SeedCommand:
        arguments:
            $environment: '%kernel.environment%'

    App\Command\ClaudeDesktopConfigCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # The scripted elicitation handler is stateful: a test scripts an answer and
    # then reads back what was asked. Resetting it on kernel.reset keeps that
    # state from leaking between requests in a long-running worker.
    App\Mcp\Client\ScriptedElicitationHandler:
        tags:
            - { name: kernel.reset, method: reset }

    # The chat host's model, picked at runtime: the locator keeps the two remote
    # platforms uninstantiated unless MCP_DEMO_CHAT_PLATFORM names one of them.
    App\Chat\Platform\HostPlatform:
        arguments:
            $platforms: !service_locator
                scripted: '@App\Chat\Platform\ScriptedPlatform'
                anthropic: '@ai.platform.anthropic'
                openai: '@ai.platform.openai'
            $platform: '%env(MCP_DEMO_CHAT_PLATFORM)%'
            $model: '%env(MCP_DEMO_CHAT_MODEL)%'

    # The chat's three collaborators are all named services rather than types:
    # one agent of several possible ones, one message store of several possible
    # ones, and the MCP client that is a client rather than a server.
    App\Chat\ChatHost:
        arguments:
            $agent: '@ai.agent.host'
            $store: '@ai.message_store.session.host'
            $servers: '@mcp.client.host'

    App\Chat\Mcp\HostSurface:
        arguments:
            $host: '@mcp.client.host'
            $cache: '@cache.app'

    # The chat renders the model's answers as markdown, and a model's answer is
    # whatever a tool put in front of it. CommonMark passes raw HTML through by
    # default, so the converter behind `|markdown_to_html` is configured not to:
    # a talk abstract containing a <script> tag would otherwise be one.
    app.markdown.converter:
        class: League\CommonMark\CommonMarkConverter
        arguments:
            - html_input: 'escape'
              allow_unsafe_links: false

    twig.markdown.default:
        class: Twig\Extra\Markdown\LeagueMarkdown
        arguments: ['@app.markdown.converter']
