security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # The organizer MCP server can write to the programme, so it gets its own
        # firewall. Access control on an MCP endpoint is plain Symfony security:
        # the bundle gives each server a stable path, and everything else is
        # ordinary framework configuration.
        mcp_organizer:
            pattern: ^/mcp/organizer
            stateless: true
            provider: users_in_memory
            custom_authenticators:
                - App\Security\OrganizerTokenAuthenticator

        main:
            lazy: true
            provider: users_in_memory

    access_control:
        - { path: ^/mcp/organizer, roles: ROLE_ORGANIZER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
