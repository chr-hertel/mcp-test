mcp:
    # ------------------------------------------------------------------------
    # Servers: what this application exposes to MCP hosts.
    #
    # Three of them, to show that "which server exposes what" is a configuration
    # decision, not a code one. The same attributed services are available to all
    # three; each server's capability lists decide which of them it actually
    # serves, and each gets its own route, identity and session store.
    # ------------------------------------------------------------------------
    servers:
        # The public face: everything is read-only, so this is the one that is
        # safe to hand to a host without a firewall in front of it.
        conference:
            name: 'symfonycon-programme'
            version: '1.0.0'
            description: 'The SymfonyCon Berlin 2026 programme: talks, speakers, tracks and the schedule.'
            website_url: 'https://symfony.com/symfonycon'
            icons:
                - src: 'https://symfony.com/favicon.ico'
                  mime_type: 'image/x-icon'
                  sizes: ['any']
            instructions: |
                This server exposes the programme of SymfonyCon Berlin 2026.

                Start with `search_talks` for anything open-ended, then read `talk://<slug>` for
                the full record of a hit. `conference://current` gives you the dates and the
                timezone; `schedule://<YYYY-MM-DD>` the agenda of one day as Markdown.

                Everything here is read-only. Scheduling and CFP handling live on the separate
                "organizer" server, which requires authentication.
            # Deliberately below the number of tools, so this server actually
            # paginates and the regression suite exercises cursor following.
            pagination_limit: 5
            transports:
                stdio: true    # for Claude Desktop, via `bin/console mcp:server conference`
                http: true     # for the MCP Inspector and the regression suite
            http:
                path: /mcp
            session:
                store: file
                # directory defaults to %kernel.cache_dir%/mcp-sessions/conference

            registry:
                tools:
                    - 'App\Mcp\Tool\Programme\'
                prompts: ['*']
                resources: ['*']
                resource_templates: ['*']
                apps: ['*']

        # The privileged face: it can write. Guarded by config/packages/security.yaml.
        organizer:
            name: 'symfonycon-organizer'
            version: '1.0.0'
            description: 'Programme committee tooling: scheduling, the CFP inbox and workspace imports.'
            instructions: |
                Organizer tooling for SymfonyCon Berlin 2026. Everything the "conference" server
                offers is here too, plus the writing tools.

                `schedule_talk` refuses to double-book a room, so treat its errors as real
                conflicts rather than something to retry with force. `submit_proposal` asks the
                user for the speaker details it is missing, and `review_proposal` asks your model
                to draft the review — both degrade to a plain message when the client cannot do
                that. The `*_mrtr` variants ask the same things by returning the question instead
                of sending it, which works on every protocol revision.
            transports:
                stdio: true
                http: true
            http:
                path: /mcp/organizer
            session:
                store: file
                # The organizer is where one session sends several requests in a
                # row: a tool call that elicits or samples, and the answer to it.
                # The lock serializes them, so none overwrites what another saved.
                lock:
                    enabled: true
                    timeout: 10

            registry:
                tools:
                    - 'App\Mcp\Tool\Programme\'
                    - 'App\Mcp\Tool\Organizer\'
                prompts: ['*']
                resources: ['*']
                resource_templates: ['*']
                apps: ['*']

        # The workbench: tools that exist to be poked at while developing against
        # the SDK and the bundle. Never exposed over STDIO — nothing here is
        # meant for a general-purpose host.
        diagnostics:
            name: 'mcp-demo-diagnostics'
            version: '1.0.0'
            description: 'Protocol-level probes: capability detection, progress streams, deliberate failures.'
            instructions: |
                A workbench for the MCP protocol itself. `probe_client` reports which optional
                capabilities the connected client advertises, `emit_progress` produces a stream of
                progress notifications, and `fail_on_purpose` always fails — in either of the two
                distinguishable ways a tool can.
            transports:
                stdio: false
                http: true
            http:
                path: /mcp/diagnostics
            session:
                # A different store kind on purpose: the bundle rejects two servers
                # sharing one, and this exercises the PSR-16 path.
                store: cache
                ttl: 900

            registry:
                tools:
                    - 'App\Mcp\Tool\Diagnostics\'

        # The 2026-07-28 lifecycle. No initialize, no session, no server-initiated
        # requests — every request carries its own protocol version and client
        # capabilities, so any worker can answer any request.
        #
        # A server is not in one era or the other: the SDK classifies each request
        # and routes it to the lifecycle it belongs to, so every server above
        # answers modern clients too, and this one still answers handshake ones.
        # `protocol_versions` narrows the modern leg to the single revision, which
        # is what makes this a clean subject for the regression suite; there is no
        # way to narrow the handshake leg, so STDIO is off by choice rather than by
        # configuration. See docs/patches.md.
        modern:
            name: 'symfonycon-2026'
            version: '1.0.0'
            description: 'The conference programme over protocol revision 2026-07-28.'
            instructions: |
                The same programme as the "conference" server, over the 2026-07-28 lifecycle.

                There are no server-initiated requests here: `submit_proposal` returns the
                question it needs answered and you call it again with the answer attached.
                `describe_request` reports what your own request declared.
            protocol_versions: ['2026-07-28']
            transports:
                stdio: false      # STDIO would serve the handshake leg too; the `modern` client over conference_stdio covers the modern wire there
                http: true
            http:
                path: /mcp/2026

            # Signs what a multi-round-trip answer carries through the client. The
            # same key must reach every process that might serve the retry, so a
            # per-process random value only works single-process.
            request_state:
                key: '%env(MCP_REQUEST_STATE_KEY)%'
                ttl: 600

            # The revision requires ttlMs/cacheScope on server/discover, the list
            # methods and resources/read. The default of 0/private is conformant
            # and refuses all caching; these say what we actually mean.
            cache:
                ttl_ms: 30000
                scope: private
                methods:
                    'server/discover': { ttl_ms: 3600000, scope: public }
                    'tools/list': { ttl_ms: 3600000, scope: public }
                    'prompts/list': { ttl_ms: 3600000, scope: public }

            # subscriptions/listen replaces the HTTP GET stream. The cache-backed
            # bus is the one that works under PHP-FPM, where the publisher and the
            # process holding the stream open are different workers.
            #
            # Five seconds rather than the minute a deployment would want: the
            # built-in web server hands a response over only when it closes, so
            # every frame of a stream arrives at once at the end of it, and the
            # regression suite has to wait each stream out. See docs/deployment.md.
            subscriptions:
                bus: cache
                lifetime: 5

            # No `tasks:` here. The Tasks extension (SEP-2663) was carved out of
            # the SDK branch into its own PR, so nothing on the tracked branch
            # implements it — see docs/patches.md.

            registry:
                tools:
                    - 'App\Mcp\Tool\Modern\'
                    - 'App\Mcp\Tool\Programme\'
                prompts: ['*']
                resources: ['*']
                resource_templates: ['*']
                apps: ['*']

        # The server side of the protocol matrix: a server that answers one old
        # revision and nothing else. Its handshake leg is pinned to 2025-06-18,
        # and listing no modern revision refuses the modern era outright — so a
        # 2025-11-25 client has to negotiate down, and a 2026-07-28 client has to
        # notice and fall back to the handshake. Only negotiation is checked
        # here; see App\Mcp\Regression\ProtocolMatrix.
        legacy:
            name: 'symfonycon-legacy'
            version: '1.0.0'
            description: 'The read-only programme, for clients that stopped at protocol revision 2025-06-18.'
            protocol_versions: ['2025-06-18']
            transports:
                stdio: true
                http: false    # negotiation does not depend on the transport, and STDIO keeps it in `make check`
            session:
                store: file

            registry:
                tools:
                    - 'App\Mcp\Tool\Programme\'

    # ------------------------------------------------------------------------
    # Clients: the remote MCP servers this application reaches out to.
    #
    # All of them point back at this very application. That is what makes the
    # regression suite possible: `bin/console app:mcp:regression` drives a real
    # MCP client, over a real transport, against a real server — so a change in
    # either upstream library shows up as a failing assertion here.
    #
    # The suite is a matrix. The protocol revision is a property of the client,
    # so each column is one client — `handshake` and `modern`, one per era —
    # and both point at the same servers, so each row is one server connection.
    # App\Mcp\Regression\ProtocolMatrix spells the cells out, together with the
    # ones that only check what an older revision negotiates.
    #
    # The `host` client is the odd one out: it points back here too, but for a
    # reader rather than for a test — it is what the chat page at /chat talks
    # to. See docs/chat.md.
    # ------------------------------------------------------------------------
    clients:
        # The handshake-era column: `initialize`, a session, and requests the
        # server sends the client while one of its own is open.
        handshake:
            client_info:
                name: 'mcp-demo-handshake'
                version: '1.0.0'
                description: 'The regression harness of the MCP demo application, on the handshake lifecycle.'
            # Pinned, because the SDK's client defaults to 2026-07-28 and would
            # settle on it against every server here, leaving this column empty.
            protocol_version: '2025-11-25'
            # Handlers for the three things a server can ask a client. Each
            # capability is advertised only because a handler backs it.
            roots: 'App\Mcp\Client\WorkspaceRootsProvider'
            sampling: 'App\Mcp\Client\ScriptedSamplingHandler'
            elicitation: 'App\Mcp\Client\ScriptedElicitationHandler'
            forward_server_logs: true
            request_timeout: 30

            # One list for both columns: what differs between them is the client,
            # never the server it reaches.
            servers: &matrix_servers
                # Over STDIO, by spawning this application's own console command.
                # No web server needed, which is what `make check` and CI use.
                # The SDK's StdioTransport settles the era on the client's first
                # request, so STDIO serves both columns.
                conference_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'conference']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'
                organizer_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'organizer']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'
                legacy_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'legacy']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'

                # Over HTTP, against the running web server.
                conference_http:
                    transport: http
                    url: '%env(MCP_DEMO_BASE_URL)%/mcp'
                organizer_http:
                    transport: http
                    url: '%env(MCP_DEMO_BASE_URL)%/mcp/organizer'
                    headers:
                        Authorization: 'Bearer %env(MCP_DEMO_ORGANIZER_TOKEN)%'
                diagnostics_http:
                    transport: http
                    url: '%env(MCP_DEMO_BASE_URL)%/mcp/diagnostics'
                # The `modern` server narrows its modern leg to 2026-07-28 but
                # still answers the handshake, so it belongs in both columns too.
                modern_http:
                    transport: http
                    url: '%env(MCP_DEMO_BASE_URL)%/mcp/2026'

        # The 2026-07-28 column. `protocol_version` is what picks the era: the
        # SDK's client stops sending `initialize`, puts the `_meta` envelope on
        # every request, derives the SEP-2243 headers from the message, and
        # answers a multi round-trip call itself — so the caller sees the same
        # API it uses against a handshake server.
        modern:
            client_info:
                name: 'mcp-demo-modern'
                version: '1.0.0'
                description: 'The regression harness of the MCP demo application, on the modern lifecycle.'
            protocol_version: '2026-07-28'

            # The same three handlers. The revision took away the server's way
            # of *sending* these requests, not the requests: a server returns
            # them in an `input_required` result, and the SDK's client answers
            # them from these handlers and retries the call. What no longer works
            # is a server reaching for ClientGateway::sample() or listRoots(),
            # and the suite pins that it says so.
            roots: 'App\Mcp\Client\WorkspaceRootsProvider'
            sampling: 'App\Mcp\Client\ScriptedSamplingHandler'
            elicitation: 'App\Mcp\Client\ScriptedElicitationHandler'
            forward_server_logs: true
            request_timeout: 30

            servers: *matrix_servers

        # Below the matrix: a revision older than either column, only to check
        # what it negotiates. Two servers are enough for that — one that speaks
        # everything, and one pinned to a revision this client does not ask for.
        legacy:
            client_info:
                name: 'mcp-demo-legacy'
                version: '1.0.0'
            protocol_version: '2024-11-05'
            forward_server_logs: false
            servers:
                conference_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'conference']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'
                legacy_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'legacy']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'

        # The chat host: what src/Chat drives from the browser. Its connections are
        # the only thing standing between the model and this application's data.
        #
        # STDIO on purpose: the chat then needs no web server of its own beyond the
        # one serving the page, because every turn spawns `bin/console mcp:server`
        # the way Claude Desktop would.
        host:
            client_info:
                name: 'mcp-demo-chat'
                version: '1.0.0'
                description: 'The chat host of the MCP demo application.'

            # Sampling is answered by the host's own model — the round trip a host
            # exists for: a server asks its client for a completion, and the client
            # already has one. `review_proposal` is the tool that uses it.
            sampling: 'App\Chat\Mcp\ModelSamplingHandler'

            # The same roots the `handshake` client advertises, so the CFP import
            # tool works from the chat too.
            roots: 'App\Mcp\Client\WorkspaceRootsProvider'

            # No elicitation handler, deliberately: a server question mid-tool-call
            # has nowhere to go in a single HTTP round trip, so `submit_proposal`
            # degrades to the message it degrades to for any client that cannot be
            # asked. That degradation is the point — see docs/chat.md.
            forward_server_logs: true

            # A turn can spawn several tool calls, each a process start and a
            # Doctrine boot; the `handshake` client's 30 seconds is tight for that.
            request_timeout: 60

            servers:
                conference:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'conference']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'
                organizer:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'organizer']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'

        # Identity, timeouts and handlers are per client: this one advertises
        # nothing, so the same servers see a client that cannot be asked for
        # roots, sampling or elicitation.
        minimal:
            client_info:
                name: 'mcp-demo-minimal'
                version: '1.0.0'
            forward_server_logs: false
            servers:
                # A server that dies before answering. The SDK's client reports
                # the exit code and the end of stderr instead of only "no longer
                # running", and stops claiming to be connected.
                dead_stdio:
                    transport: stdio
                    command: ['php', '-r', 'fwrite(STDERR, "refusing to serve: no licence key\n"); exit(3);']
                    init_timeout: 5
                conference_stdio:
                    transport: stdio
                    command: ['php', 'bin/console', 'mcp:server', 'conference']
                    cwd: '%kernel.project_dir%'
                    env:
                        APP_ENV: '%kernel.environment%'
